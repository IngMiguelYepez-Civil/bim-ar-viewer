<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Pantalla de Selección de Proyectos -->
        <div id="project-selection-screen">
            <header>
                <h1>BIM Viewer</h1>
            </header>
            <main>
                <h2>Mis Proyectos</h2>
                <ul id="project-list">
                    <!-- Los proyectos se cargarán aquí con JavaScript -->
                </ul>
                <button id="launch-button" disabled>Launch</button>
            </main>
        </div>

        <!-- Pantalla del Visor 3D -->
        <div id="viewer-screen" style="display: none;">
            <header>
                <button id="back-button">←</button>
                <h1 id="project-title">Nombre del Proyecto</h1>
            </header>
            <div id="canvas-container"></div>
        </div>

        <footer>
            <a href="https://www.linkedin.com/in/ing-miguel-yepez/" target="_blank">LinkedIn</a>
            <a href="https://www.patreon.com/posts/invitame-un-cafe-142422413" target="_blank">Patreon</a>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <!-- Force redeploy -->
</body>
</html>
